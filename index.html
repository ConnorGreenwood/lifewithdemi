<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(160deg,#ffd6eb,#ffeef7,#ffc9e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.45),transparent 20%),
        radial-gradient(circle at 80% 70%,rgba(255,255,255,.35),transparent 20%);
    z-index:-1;
}

.card{
    width:95%;
    max-width:430px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(18px);
    border-radius:35px;
    padding:40px 30px;
    box-shadow:0 20px 60px rgba(255,120,180,.25);
    border:1px solid rgba(255,255,255,.6);
    text-align:center;
}

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    margin:auto;
    display:block;
    box-shadow:0 10px 25px rgba(255,150,190,.4);
}

h1{
    margin-top:18px;
    font-size:32px;
    color:#d6458e;
}

.username{
    color:#777;
    margin-top:6px;
    margin-bottom:25px;
}

.bio{
    color:#666;
    font-size:15px;
    margin-bottom:35px;
    line-height:1.6;
}

.link{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    height:58px;
    border-radius:18px;
    margin-bottom:18px;
    color:#fff;
    font-weight:600;
    font-size:17px;
    transition:.25s;
    background:linear-gradient(135deg,#ff6fb1,#ff9ac8);
    box-shadow:0 8px 20px rgba(255,110,180,.3);
}

.link:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 14px 28px rgba(255,110,180,.45);
}

.sparkles{
    font-size:14px;
    color:#ff6fb1;
    margin-top:18px;
}

footer{
    margin-top:28px;
    color:#999;
    font-size:13px;
}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.heart{
    position:absolute;
    color:white;
    opacity:.35;
    animation:float 12s linear infinite;
}

@keyframes float{
0%{
    transform:translateY(100vh) rotate(0deg);
}
100%{
    transform:translateY(-20vh) rotate(360deg);
}
}

</style>
</head>

<body>

<div class="hearts">
<div class="heart" style="left:8%;font-size:22px;animation-delay:0s;">🤍</div>
<div class="heart" style="left:18%;font-size:28px;animation-delay:4s;">💖</div>
<div class="heart" style="left:34%;font-size:20px;animation-delay:7s;">💕</div>
<div class="heart" style="left:55%;font-size:26px;animation-delay:2s;">🤍</div>
<div class="heart" style="left:70%;font-size:18px;animation-delay:6s;">💗</div>
<div class="heart" style="left:87%;font-size:25px;animation-delay:1s;">💖</div>
</div>
